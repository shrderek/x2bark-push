name = "x2bark-push"
main = "src/index.js"
compatibility_date = "2024-12-30"

# 开启 Workers Logs，方便在控制台看日志排查
[observability]
enabled = true

# Durable Object 托管到 Mozilla AutoPush 的 WebSocket 长连接
[durable_objects]
bindings = [{ name = "LISTENER", class_name = "Listener" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Listener"]

# 每分钟拉活一次（DO 被驱逐/重新部署后自动恢复监听）
[triggers]
crons = ["* * * * *"]

[vars]
BARK_SERVER = "https://api.day.app"
# 推送链路自愈（应对 X 静默失效订阅导致「收不到但不报错」）：
# 第一重：每隔 N 小时自动向 X 重注册订阅，0 = 关闭，默认 12
RE_REGISTER_HOURS = 12
# 第二重：连续 N 小时没收到 X 推送（不含 /test）则自动重注册，0 = 关闭（默认关闭），想开启填 2
SILENCE_HOURS = 0
# 只推送这些通知类型，逗号分隔，留空 = 全部
# 实测可用值: tweet, reply, mention, follower, favorite, xchat_message_received
# NOTIFY_TYPES = "tweet"
